<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Gráficos con Turtle</title>
  <style>
    :root {
      --bg: #0e0e11; --card: #141923; --border: #232d42; --text: #fff;
      --muted: #94a3b8; --green: #10b981; --sky: #38bdf8;
    }
    body.theme-light {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --green: #059669; --sky: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .header { text-align: center; margin-bottom: 12px; }
    .header h3 { font-size: 1.1rem; color: var(--green); margin-bottom: 4px; }
    .canvas-wrap { background: #080b10; border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: center; align-items: center; padding: 6px; margin-bottom: 12px; }
    canvas { background: #0b0f19; border-radius: 6px; }
    .presets { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn { padding: 6px 12px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); }
    .btn.active { background: var(--green); color: white; border-color: var(--green); }
    .code-box { background: #080b10; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: monospace; font-size: 0.78rem; color: #a5f3fc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>🐢 Simulador de Gráficos con Turtle (Logo)</h3>
      <p style="font-size:0.75rem; color:var(--muted)">Progresión geométrica: Línea ➔ Cuadrado ➔ Polígonos regulares ➔ Espiral.</p>
    </div>

    <div class="presets">
      <button class="btn active" onclick="drawPattern('cuadrado')">Cuadrado (4 lados)</button>
      <button class="btn" onclick="drawPattern('hexagono')">Hexágono (6 lados)</button>
      <button class="btn" onclick="drawPattern('estrella')">Estrella (5 puntas)</button>
      <button class="btn" onclick="drawPattern('espiral')">Espiral Fractal</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="turtleCanvas" width="340" height="200"></canvas>
    </div>

    <div class="code-box" id="codeOut">import turtle<br>t = turtle.Turtle()<br>for _ in range(4):<br>&nbsp;&nbsp;&nbsp;&nbsp;t.forward(80)<br>&nbsp;&nbsp;&nbsp;&nbsp;t.left(90)</div>
  </div>

  <script>
    const cv = document.getElementById('turtleCanvas');
    const ctx = cv.getContext('2d');

    function drawPattern(type) {
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();

      const cx = cv.width / 2;
      const cy = cv.height / 2;
      const code = document.getElementById('codeOut');

      if (type === 'cuadrado') {
        code.innerHTML = 'for _ in range(4):<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.forward(80)<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.left(90)';
        ctx.strokeRect(cx - 40, cy - 40, 80, 80);
      } else if (type === 'hexagono') {
        code.innerHTML = 'for _ in range(6):<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.forward(50)<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.left(60)';
        for (let i = 0; i < 6; i++) {
          const a = (i * 60) * Math.PI / 180;
          const x = cx + 55 * Math.cos(a);
          const y = cy + 55 * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      } else if (type === 'estrella') {
        code.innerHTML = 'for _ in range(5):<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.forward(100)<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.right(144)';
        ctx.strokeStyle = '#fde047';
        for (let i = 0; i < 5; i++) {
          const a = (i * 144 - 90) * Math.PI / 180;
          const x = cx + 60 * Math.cos(a);
          const y = cy + 60 * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      } else if (type === 'espiral') {
        code.innerHTML = 'for i in range(40):<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.forward(i * 3)<br>&nbsp;&nbsp;&nbsp;&nbsp;turtle.left(59)';
        ctx.strokeStyle = '#a855f7';
        let x = cx, y = cy, angle = 0;
        ctx.moveTo(x, y);
        for (let i = 1; i <= 35; i++) {
          angle += 59 * Math.PI / 180;
          x += (i * 2.5) * Math.cos(angle);
          y += (i * 2.5) * Math.sin(angle);
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    drawPattern('cuadrado');
  </script>
</body>
</html>
