<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emparejamiento de Fases del Algoritmo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #0e0e11 !important;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
<style>
  .match-box {
    background: #0e0e11;
    color: #ffffff;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #1f293d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    user-select: none;
  }
  .match-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #c084fc;
    margin-bottom: 6px;
  }
  .match-subtitle {
    font-size: 0.82rem;
    color: #94a3b8;
    margin-bottom: 16px;
  }
  .match-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .match-row {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 10px;
    align-items: center;
  }
  .phase-tag {
    background: #181d28;
    border: 1px solid #334155;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    color: #c084fc;
    text-align: center;
  }
  .match-select {
    background: #0f141d;
    border: 1px solid #334155;
    color: #ffffff;
    padding: 9px;
    border-radius: 6px;
    font-size: 0.8rem;
    outline: none;
  }
  .btn-check-m {
    background: #c084fc;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .feedback-m {
    margin-top: 12px;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }
  .feedback-m.correct { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid #4ade80; }
  .feedback-m.incorrect { background: rgba(255, 118, 118, 0.15); color: #ff7676; border: 1px solid #ff7676; }
</style>

<div class="match-box">
  <div class="match-title">Relaciona cada Fase con su Función</div>
  <div class="match-subtitle">Selecciona la descripción correspondiente para cada fase de un algoritmo:</div>

  <div class="match-grid">
    <div class="match-row">
      <div class="phase-tag">Entrada (Input)</div>
      <select class="match-select" id="sel-input">
        <option value="">-- Selecciona función --</option>
        <option value="calc">Operaciones y cálculos matemáticos.</option>
        <option value="data">Recopilación de los datos necesarios.</option>
        <option value="out">Entrega del resultado final al usuario.</option>
      </select>
    </div>

    <div class="match-row">
      <div class="phase-tag">Proceso</div>
      <select class="match-select" id="sel-proceso">
        <option value="">-- Selecciona función --</option>
        <option value="calc">Operaciones y cálculos matemáticos.</option>
        <option value="data">Recopilación de los datos necesarios.</option>
        <option value="out">Entrega del resultado final al usuario.</option>
      </select>
    </div>

    <div class="match-row">
      <div class="phase-tag">Salida (Output)</div>
      <select class="match-select" id="sel-salida">
        <option value="">-- Selecciona función --</option>
        <option value="calc">Operaciones y cálculos matemáticos.</option>
        <option value="data">Recopilación de los datos necesarios.</option>
        <option value="out">Entrega del resultado final al usuario.</option>
      </select>
    </div>
  </div>

  <button class="btn-check-m" onclick="checkMatch()">Validar Respuestas</button>
  <div class="feedback-m" id="fb-m"></div>
</div>

<script>
function checkMatch() {
  const v1 = document.getElementById('sel-input').value;
  const v2 = document.getElementById('sel-proceso').value;
  const v3 = document.getElementById('sel-salida').value;
  const fb = document.getElementById('fb-m');
  fb.style.display = 'block';

  if (v1 === 'data' && v2 === 'calc' && v3 === 'out') {
    fb.className = 'feedback-m correct';
    fb.innerText = '¡Perfecto! Entrada recopila datos, Proceso realiza los cálculos y Salida entrega los resultados.';
  } else {
    fb.className = 'feedback-m incorrect';
    fb.innerText = 'Hay elecciones incorrectas. Revisa el rol de cada fase dentro de un algoritmo.';
  }
}
</script>
</body>
</html>
