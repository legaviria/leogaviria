<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasos para la Resolución de Problemas</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #0e0e11 !important;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
<style>
  .steps-container {
    background-color: #0e0e11;
    color: #ffffff;
    padding: 18px 20px;
    border-radius: 12px;
    border: 1px solid #1f293d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 680px;
    margin: 0 auto;
  }

  .steps-header {
    text-align: center;
    margin-bottom: 16px;
  }

  .steps-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #eab308;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .steps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .step-card {
    background-color: #181d28;
    border: 1px solid #232d42;
    border-radius: 8px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .step-card:hover {
    transform: translateY(-2px);
  }

  .step-icon {
    width: 28px;
    height: 28px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-icon svg {
    width: 22px;
    height: 22px;
    stroke-width: 2.2;
    fill: none;
  }

  .step-card.blue { border-top: 3px solid #00c8ff; }
  .step-card.blue .step-icon svg { stroke: #00c8ff; }
  .step-card.blue .step-num { color: #00c8ff; }

  .step-card.yellow { border-top: 3px solid #eab308; }
  .step-card.yellow .step-icon svg { stroke: #eab308; }
  .step-card.yellow .step-num { color: #eab308; }

  .step-card.purple { border-top: 3px solid #c084fc; }
  .step-card.purple .step-icon svg { stroke: #c084fc; }
  .step-card.purple .step-num { color: #c084fc; }

  .step-card.green { border-top: 3px solid #4ade80; }
  .step-card.green .step-icon svg { stroke: #4ade80; }
  .step-card.green .step-num { color: #4ade80; }

  .step-num {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .step-desc {
    font-size: 0.75rem;
    color: #94a3b8;
    line-height: 1.2;
  }

  @media (max-width: 500px) {
    .steps-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>

<div class="steps-container">
  <div class="steps-header">
    <div class="steps-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2.2"><path d="M19.43 12.98A7.97 7.97 0 0 0 20 10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 1.38.35 2.68.97 3.82M9 17h6M10 21h4"/></svg>
      Pasos para la Resolución de Problemas
    </div>
  </div>

  <div class="steps-grid">
    <!-- Paso 1 -->
    <div class="step-card blue">
      <div class="step-icon">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="step-num">1. Analizar</div>
      <div class="step-desc">Entradas y Salidas</div>
    </div>

    <!-- Paso 2 -->
    <div class="step-card yellow">
      <div class="step-icon">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      </div>
      <div class="step-num">2. Diseñar</div>
      <div class="step-desc">Algoritmo</div>
    </div>

    <!-- Paso 3 -->
    <div class="step-card purple">
      <div class="step-icon">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </div>
      <div class="step-num">3. Codificar</div>
      <div class="step-desc">Lenguaje real</div>
    </div>

    <!-- Paso 4 -->
    <div class="step-card green">
      <div class="step-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div class="step-num">4. Probar</div>
      <div class="step-desc">Debugging</div>
    </div>
  </div>
</div>
</body>
</html>
