<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Referencias, Alias y Mutabilidad</title>
  <style>
    :root {
      --bg: #0e0e11; --card: #141923; --border: #232d42; --text: #fff;
      --muted: #94a3b8; --sky: #38bdf8; --amber: #f59e0b; --green: #10b981; --red: #ef4444;
    }
    body.theme-light {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --sky: #0284c7; --amber: #d97706; --green: #059669; --red: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .header { text-align: center; margin-bottom: 12px; }
    .header h3 { font-size: 1.1rem; color: #f59e0b; margin-bottom: 4px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tbtn { flex: 1; padding: 8px 4px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--muted); cursor: pointer; text-align: center; }
    .tbtn.active { background: rgba(245, 158, 11, 0.2); border-color: var(--amber); color: #fde047; }
    .code-view { background: #080b10; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.8rem; margin-bottom: 12px; }
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .card-var { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .card-var h5 { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .val-display { font-family: monospace; font-size: 0.95rem; font-weight: bold; }
    .expl-banner { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 0.78rem; line-height: 1.4; color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>🏷️ Simulador de Alias vs Copia Superficial vs Copia Profunda</h3>
      <p style="font-size:0.75rem; color:var(--muted)">¿Qué ocurre cuando modificamos una lista? Observa la diferencia entre compartir referencia o clonar.</p>
    </div>

    <div class="tabs">
      <button class="tbtn active" onclick="setCopyMode(1)">1. Asignación (b = a)</button>
      <button class="tbtn" onclick="setCopyMode(2)">2. Copia Superficial (copy)</button>
      <button class="tbtn" onclick="setCopyMode(3)">3. Copia Profunda (deepcopy)</button>
    </div>

    <div class="code-view" id="codeArea"></div>

    <div class="res-grid">
      <div class="card-var">
        <h5>Variable original (a)</h5>
        <div class="val-display" id="dispA" style="color:#38bdf8">[1, 999, [3, 4]]</div>
      </div>
      <div class="card-var">
        <h5>Segunda variable (b)</h5>
        <div class="val-display" id="dispB" style="color:#fde047">[1, 999, [3, 4]]</div>
      </div>
    </div>

    <div class="expl-banner" id="explArea"></div>
  </div>

  <script>
    function setCopyMode(mode) {
      document.querySelectorAll('.tbtn').forEach((b, i) => b.classList.toggle('active', i === mode - 1));
      const cArea = document.getElementById('codeArea');
      const dA = document.getElementById('dispA');
      const dB = document.getElementById('dispB');
      const exp = document.getElementById('explArea');

      if (mode === 1) { // Alias
        cArea.innerHTML = 'a = [1, 2, [3, 4]]<br>b = a  # ALIAS: Misma referencia<br>b[1] = 999';
        dA.textContent = '[1, 999, [3, 4]]';
        dB.textContent = '[1, 999, [3, 4]]';
        exp.innerHTML = '<strong style="color:#f87171">⚠️ Efecto Colateral (Alias):</strong> Al hacer <code>b = a</code> no se crea una nueva lista. Ambas variables apuntan al mismo objeto. Modificar <code>b[1]</code> altera también a <code>a</code> (<code>a is b</code> es True).';
      } else if (mode === 2) { // Shallow
        cArea.innerHTML = 'import copy<br>a = [1, 2, [3, 4]]<br>b = a.copy()  # COPIA SUPERFICIAL<br>b[1] = 999<br>b[2][0] = 777  # Modifica sublista anidada';
        dA.textContent = '[1, 2, [777, 4]]';
        dB.textContent = '[1, 999, [777, 4]]';
        exp.innerHTML = '<strong style="color:#fbbf24">⚡ Copia Superficial:</strong> La lista exterior es independiente (el 999 no afectó a <code>a[1]</code>), pero los objetos anidados interiores siguen compartidos por referencia (ambos tienen 777 en la sublista).';
      } else if (mode === 3) { // Deepcopy
        cArea.innerHTML = 'import copy<br>a = [1, 2, [3, 4]]<br>b = copy.deepcopy(a)  # COPIA PROFUNDA TOTAL<br>b[1] = 999<br>b[2][0] = 777';
        dA.textContent = '[1, 2, [3, 4]]';
        dB.textContent = '[1, 999, [777, 4]]';
        exp.innerHTML = '<strong style="color:#4ade80">✅ Copia Profunda (Totalmente Aislada):</strong> Se clona recursivamente toda la estructura y sus subobjetos en nuevas direcciones de memoria. Ninguna modificación en <code>b</code> puede afectar a <code>a</code>.';
      }
    }
    setCopyMode(1);
  </script>
</body>
</html>
