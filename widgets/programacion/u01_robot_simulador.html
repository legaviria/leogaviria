<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Instrucciones - Robot</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #0e0e11 !important;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
<style>
  .sim-container {
    background-color: #0e0e11;
    color: #ffffff;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f293d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 580px;
    margin: 0 auto;
  }

  .sim-header {
    text-align: center;
    margin-bottom: 12px;
  }
  .sim-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #00c8ff;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .sim-subtitle {
    font-size: 0.82rem;
    color: #94a3b8;
  }

  .controls-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .btn-cmd {
    background: #181d28;
    color: #ffffff;
    border: 1px solid #232d42;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-cmd:hover {
    background: #232d42;
    border-color: #00c8ff;
  }
  .btn-cmd svg {
    width: 14px;
    height: 14px;
    stroke-width: 2.2;
  }

  .btn-blue svg { stroke: #00c8ff; }
  .btn-teal svg { stroke: #00d2a0; }
  .btn-yellow svg { stroke: #eab308; }
  .btn-red {
    background: #2a1215;
    border-color: #4a1d24;
    color: #ff7676;
  }
  .btn-red:hover {
    background: #3b181c;
    border-color: #ff7676;
  }
  .btn-red svg { stroke: #ff7676; }

  .queue-box {
    background-color: #141419;
    border: 1px solid #1f293d;
    border-radius: 8px;
    padding: 10px;
    font-size: 0.85rem;
    color: #94a3b8;
    min-height: 42px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
  }
  .badge {
    background-color: #1e293b;
    color: #00c8ff;
    border: 1px solid #334155;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.75rem;
    white-space: nowrap;
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    height: 220px;
    background-color: #05070a;
    border-radius: 8px;
    border: 1px solid #1f293d;
    overflow: hidden;
  }

  canvas#robotCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  .btn-exec {
    background: #10b981;
    color: #000000;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .btn-exec:hover {
    background: #4ade80;
  }
  .btn-exec svg {
    width: 16px;
    height: 16px;
    fill: #000;
  }

  .status-text {
    font-size: 0.8rem;
    color: #4ade80;
    font-weight: 600;
  }
</style>

<div class="sim-container">
  <div class="sim-header">
    <div class="sim-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      Simulador de Instrucciones
    </div>
    <div class="sim-subtitle">Programa las acciones secuenciales del robot</div>
  </div>

  <div class="controls-row">
    <button class="btn-cmd btn-blue" onclick="addCmd('Avanzar')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Avanzar
    </button>
    <button class="btn-cmd btn-teal" onclick="addCmd('Girar')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      Girar 90°
    </button>
    <button class="btn-cmd btn-yellow" onclick="addCmd('Recoger')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 8l-9-4-9 4 9 4 9-4zM3 8v8l9 4 9-4V8M12 12v8"/></svg>
      Recoger
    </button>
    <button class="btn-cmd btn-red" onclick="clearCmds()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Limpiar
    </button>
  </div>

  <div class="queue-box" id="queue">Programa vacío...</div>

  <div class="canvas-wrapper">
    <canvas id="robotCanvas"></canvas>
  </div>

  <div class="action-bar">
    <button class="btn-exec" onclick="execProg()">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      Ejecutar
    </button>
    <div class="status-text" id="status-log">Estado: Esperando órdenes</div>
  </div>
</div>

<script>
let cmds = [];
let isExecuting = false;

// Estado del Robot
let robot = {
  x: 50,
  y: 110,
  angle: 0, // 0: derecha, 90: abajo, 180: izquierda, 270: arriba
  hasBox: false
};

const canvas = document.getElementById('robotCanvas');
const ctx = canvas.getContext('2d');

function initCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  drawScene();
}

function drawGrid() {
  ctx.strokeStyle = '#1f293d';
  ctx.lineWidth = 1;
  const size = 30;
  for(let x = 0; x < canvas.width; x += size) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for(let y = 0; y < canvas.height; y += size) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawRobot() {
  ctx.save();
  ctx.translate(robot.x, robot.y);
  ctx.rotate((robot.angle * Math.PI) / 180);

  // Cuerpo del robot
  ctx.fillStyle = '#00c8ff';
  ctx.shadowColor = '#00c8ff';
  ctx.shadowBlur = 8;
  ctx.fillRect(-15, -15, 30, 30);

  // Ojos/Dirección (Frente)
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000000';
  ctx.fillRect(5, -10, 6, 6);
  ctx.fillRect(5, 4, 6, 6);

  ctx.fillStyle = '#4ade80';
  ctx.fillRect(8, -8, 2, 2);
  ctx.fillRect(8, 6, 2, 2);

  // Objeto recogido
  if (robot.hasBox) {
    ctx.fillStyle = '#eab308';
    ctx.fillRect(-8, -8, 12, 12);
  }

  ctx.restore();
}

function drawScene() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawRobot();
}

function addCmd(c) {
  if (isExecuting) return;
  cmds.push(c);
  renderQueue();
}

function renderQueue() {
  const q = document.getElementById('queue');
  if (cmds.length === 0) {
    q.innerHTML = 'Programa vacío...';
    return;
  }
  q.innerHTML = cmds.map(c => `<span class="badge">${c}</span>`).join(' ➔ ');
}

function clearCmds() {
  if (isExecuting) return;
  cmds = [];
  robot = { x: 50, y: 110, angle: 0, hasBox: false };
  renderQueue();
  document.getElementById('status-log').innerText = 'Estado: Reset completado';
  document.getElementById('status-log').style.color = '#4ade80';
  drawScene();
}

async function execProg() {
  if (isExecuting) return;
  if (cmds.length === 0) {
    document.getElementById('status-log').innerText = '⚠️ Lista vacía';
    document.getElementById('status-log').style.color = '#ff7676';
    return;
  }

  isExecuting = true;
  document.getElementById('status-log').style.color = '#00c8ff';

  for (let i = 0; i < cmds.length; i++) {
    const cmd = cmds[i];
    document.getElementById('status-log').innerText = `Ejecutando (${i+1}/${cmds.length}): ${cmd}`;

    if (cmd === 'Avanzar') {
      await animateMove(40);
    } else if (cmd === 'Girar') {
      await animateRotate(90);
    } else if (cmd === 'Recoger') {
      robot.hasBox = !robot.hasBox;
      drawScene();
      await new Promise(r => setTimeout(r, 300));
    }
  }

  document.getElementById('status-log').innerText = '✓ ¡Programa completado!';
  document.getElementById('status-log').style.color = '#4ade80';
  isExecuting = false;
}

function animateMove(distance) {
  return new Promise(resolve => {
    let moved = 0;
    const rad = (robot.angle * Math.PI) / 180;
    const dx = Math.cos(rad);
    const dy = Math.sin(rad);

    const interval = setInterval(() => {
      robot.x += dx * 2;
      robot.y += dy * 2;

      // Limites de pantalla
      robot.x = Math.max(20, Math.min(canvas.width - 20, robot.x));
      robot.y = Math.max(20, Math.min(canvas.height - 20, robot.y));

      moved += 2;
      drawScene();

      if (moved >= distance) {
        clearInterval(interval);
        resolve();
      }
    }, 16);
  });
}

function animateRotate(deg) {
  return new Promise(resolve => {
    let rotated = 0;
    const interval = setInterval(() => {
      robot.angle = (robot.angle + 5) % 360;
      rotated += 5;
      drawScene();

      if (rotated >= deg) {
        clearInterval(interval);
        resolve();
      }
    }, 16);
  });
}

setTimeout(initCanvas, 100);
</script>
</body>
</html>
