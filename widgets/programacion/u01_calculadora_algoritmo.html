<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Calculadora: Entrada - Proceso - Salida</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #0e0e11 !important;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
<style>
  .calc-container {
    background-color: #0e0e11;
    color: #ffffff;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1f293d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 520px; /* Ancho general más compacto */
    margin: 0 auto;
  }

  .calc-header {
    text-align: center;
    margin-bottom: 14px;
  }

  .calc-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #00c8ff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .calc-flow {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  /* Bloques más estrechos y compactos */
  .flow-card {
    background-color: #181d28;
    border: 1px solid #232d42;
    border-radius: 8px;
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 115px;
    justify-content: space-between;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  /* Personalización por bloque */
  .flow-card.blue { border-top: 3px solid #00c8ff; }
  .flow-card.blue .card-header { color: #00c8ff; }

  .flow-card.yellow { border-top: 3px solid #eab308; }
  .flow-card.yellow .card-header { color: #eab308; }

  .flow-card.green { border-top: 3px solid #4ade80; }
  .flow-card.green .card-header { color: #4ade80; }

  /* Inputs agrandados y adaptables */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: #94a3b8;
    gap: 4px;
  }

  /* Estilos mejorados para los campos de texto */
  .calc-input {
    width: 100%;
    max-width: 65px; /* Más ancho */
    background: #0f141d;
    border: 1px solid #334155;
    color: #ffffff;
    font-weight: 700;
    text-align: center;
    padding: 5px 4px; /* Mayor espacio interno */
    border-radius: 6px;
    font-size: 0.9rem; /* Fuente más legible */
    outline: none;
    transition: all 0.2s;
  }
  .calc-input:focus {
    border-color: #00c8ff;
    box-shadow: 0 0 6px rgba(0, 200, 255, 0.3);
  }

  /* Fórmula y Botón */
  .formula-text {
    font-size: 0.68rem;
    color: #94a3b8;
    background: #0f141d;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid #1f293d;
    font-family: monospace;
    margin-bottom: 6px;
  }

  .btn-calc {
    background: #eab308;
    color: #000000;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background 0.2s, transform 0.1s;
    width: 100%;
    justify-content: center;
  }
  .btn-calc:hover {
    background: #facc15;
  }
  .btn-calc:active {
    transform: scale(0.96);
  }

  /* Salida */
  .output-box {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }

  .output-value {
    font-size: 1.4rem;
    font-weight: 800;
    color: #4ade80;
    text-shadow: 0 0 8px rgba(74, 222, 128, 0.25);
  }

  /* Conectores */
  .arrow-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .arrow-connector svg {
    width: 14px;
    height: 14px;
    stroke: #475569;
    stroke-width: 2.5;
  }

  @media (max-width: 480px) {
    .calc-flow {
      flex-direction: column;
    }
    .arrow-connector svg {
      transform: rotate(90deg);
    }
    .calc-input {
      max-width: 100px;
    }
  }
</style>

<div class="calc-container">
  <div class="calc-header">
    <div class="calc-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2.2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
      Calculadora de Promedio
    </div>
  </div>

  <div class="calc-flow">
    <!-- ENTRADA -->
    <div class="flow-card blue">
      <div class="card-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2.2"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        ENTRADA
      </div>
      <div class="input-group">
        <div class="input-row">
          <label for="n1">N1:</label>
          <input type="number" id="n1" value="4.5" step="0.1" class="calc-input">
        </div>
        <div class="input-row">
          <label for="n2">N2:</label>
          <input type="number" id="n2" value="3.5" step="0.1" class="calc-input">
        </div>
      </div>
    </div>

    <!-- FLECHA 1 -->
    <div class="arrow-connector">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>

    <!-- PROCESO -->
    <div class="flow-card yellow">
      <div class="card-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2.2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        PROCESO
      </div>
      <div class="formula-text">(N1 + N2) / 2</div>
      <button class="btn-calc" onclick="calcular()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Calcular
      </button>
    </div>

    <!-- FLECHA 2 -->
    <div class="arrow-connector">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>

    <!-- SALIDA -->
    <div class="flow-card green">
      <div class="card-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.2"><path d="M12 17V3"/><path d="m8 7 4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        SALIDA
      </div>
      <div class="output-box">
        <div id="res-promedio" class="output-value">--</div>
      </div>
    </div>
  </div>
</div>

<script>
function calcular() {
  const n1 = parseFloat(document.getElementById('n1').value) || 0;
  const n2 = parseFloat(document.getElementById('n2').value) || 0;
  const prom = (n1 + n2) / 2;
  document.getElementById('res-promedio').innerText = prom.toFixed(2);
}
</script>
</body>
</html>
