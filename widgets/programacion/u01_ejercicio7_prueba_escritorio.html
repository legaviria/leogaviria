<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Escritorio Interactiva</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #0e0e11 !important;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
<style>
  .trace-box {
    background: #0e0e11;
    color: #ffffff;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #1f293d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 580px;
    margin: 0 auto;
  }
  .trace-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #00c8ff;
    margin-bottom: 8px;
  }
  .trace-code {
    background: #141419;
    border: 1px solid #1f293d;
    padding: 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.8rem;
    color: #4ade80;
    margin-bottom: 12px;
  }
  .trace-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
  }
  .trace-table th, .trace-table td {
    border: 1px solid #232d42;
    padding: 8px;
    text-align: center;
    font-size: 0.8rem;
  }
  .trace-table th { background: #181d28; color: #00c8ff; }
  .trace-input {
    width: 50px;
    background: #0f141d;
    border: 1px solid #334155;
    color: #fff;
    text-align: center;
    border-radius: 4px;
    padding: 2px;
  }
  .btn-check-tr {
    background: #00c8ff;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .tr-fb {
    margin-top: 12px;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }
  .tr-fb.correct { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid #4ade80; }
  .tr-fb.incorrect { background: rgba(255, 118, 118, 0.15); color: #ff7676; border: 1px solid #ff7676; }
</style>

<div class="trace-box">
  <div class="trace-title">Prueba de Escritorio</div>
  <div class="trace-code">
    a = 4<br>
    b = 6<br>
    promedio = (a + b) / 2
  </div>

  <table class="trace-table">
    <tr>
      <th>Variable</th>
      <th>Valor esperado</th>
    </tr>
    <tr>
      <td><code>a</code></td>
      <td><input type="number" class="trace-input" id="tr-a"></td>
    </tr>
    <tr>
      <td><code>b</code></td>
      <td><input type="number" class="trace-input" id="tr-b"></td>
    </tr>
    <tr>
      <td><code>promedio</code></td>
      <td><input type="number" class="trace-input" id="tr-prom"></td>
    </tr>
  </table>

  <button class="btn-check-tr" onclick="checkTrace()">Comprobar Valores</button>
  <div class="tr-fb" id="tr-fb"></div>
</div>

<script>
function checkTrace() {
  const va = parseInt(document.getElementById('tr-a').value);
  const vb = parseInt(document.getElementById('tr-b').value);
  const vp = parseFloat(document.getElementById('tr-prom').value);
  const fb = document.getElementById('tr-fb');
  fb.style.display = 'block';

  if (va === 4 && vb === 6 && vp === 5) {
    fb.className = 'tr-fb correct';
    fb.innerText = '¡Excelente! Has rastreado correctamente el valor de las variables.';
  } else {
    fb.className = 'tr-fb incorrect';
    fb.innerText = 'Hay errores en la tabla. Realiza las operaciones en orden.';
  }
}
</script>
</body>
</html>
