<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practica: Jerarquía de Órdenes de Complejidad</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: #0e0e11 !important;
      color: #e2e8f0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .practica-card {
      background-color: #141419;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 680px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .title {
      font-size: 1rem;
      font-weight: 700;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.7rem;
      font-family: monospace;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-weight: bold;
    }
    .instruction {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .items-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .item-btn {
      background: #181d28;
      border: 1px solid #232d42;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.78rem;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .item-btn:hover:not(.selected) {
      border-color: #f59e0b;
      color: #fff;
    }
    .item-btn.selected {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fbbf24;
      font-weight: bold;
    }
    .order-display {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      min-height: 52px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .order-tag {
      background: #1f293d;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .order-tag i {
      cursor: pointer;
      color: #f87171;
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn {
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-verify {
      background: #f59e0b;
      color: #000;
    }
    .btn-verify:hover {
      background: #fbbf24;
    }
    .btn-reset {
      background: #21262d;
      color: #cbd5e1;
      border: 1px solid #30363d;
    }
    .btn-reset:hover {
      background: #30363d;
      color: #fff;
    }
    .feedback {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      display: none;
      line-height: 1.4;
    }
    .feedback.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }
    .feedback.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>

<div class="practica-card">
  <div class="header">
    <div class="title">
      <i class="fas fa-arrow-down-short-wide"></i>
      <span>Reto Interactivo: Ordenar Jerarquía Big-O</span>
    </div>
    <span class="badge">PRACTICA</span>
  </div>

  <div class="instruction">
    Haz clic en las notaciones de complejidad en orden <strong>desde la más eficiente (crecimiento más lento) hasta la menos eficiente (crecimiento más rápido)</strong>:
  </div>

  <div class="items-container" id="pool"></div>

  <div class="instruction" style="margin-bottom: 6px; font-weight: 600; color: #cbd5e1;">Tu secuencia ordenada:</div>
  <div class="order-display" id="sequence">
    <span style="color: #64748b; font-size: 0.75rem; font-style: italic;" id="placeholder">Haz clic sobre las opciones para agregarlas en orden...</span>
  </div>

  <div class="actions">
    <button class="btn btn-reset" onclick="resetGame()"><i class="fas fa-undo mr-1"></i> Reiniciar</button>
    <button class="btn btn-verify" onclick="verify()"><i class="fas fa-check mr-1"></i> Verificar Respuesta</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<script>
const items = [
  { id: "o1", label: "O(1) - Constante", rank: 1 },
  { id: "ologn", label: "O(log n) - Logarítmica", rank: 2 },
  { id: "on", label: "O(n) - Lineal", rank: 3 },
  { id: "onlogn", label: "O(n log n) - Linearítmica", rank: 4 },
  { id: "on2", label: "O(n²) - Cuadrática", rank: 5 },
  { id: "o2n", label: "O(2ⁿ) - Exponencial", rank: 6 },
  { id: "onfact", label: "O(n!) - Factorial", rank: 7 }
];

let selectedIds = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let shuffledItems = shuffle(items);

function renderPool() {
  const pool = document.getElementById('pool');
  pool.innerHTML = shuffledItems.map(item => {
    const isSel = selectedIds.includes(item.id);
    return `
      <div class="item-btn ${isSel ? 'selected' : ''}" onclick="selectItem('${item.id}')">
        <span style="font-family: monospace;">${item.label}</span>
        ${isSel ? '<i class="fas fa-check text-xs"></i>' : '<i class="fas fa-plus text-xs text-gray-500"></i>'}
      </div>
    `;
  }).join('');
}

function renderSequence() {
  const seq = document.getElementById('sequence');
  if (selectedIds.length === 0) {
    seq.innerHTML = '<span style="color: #64748b; font-size: 0.75rem; font-style: italic;" id="placeholder">Haz clic sobre las opciones para agregarlas en orden...</span>';
    return;
  }
  seq.innerHTML = selectedIds.map((id, idx) => {
    const it = items.find(x => x.id === id);
    return `
      <span class="order-tag">
        <span>${idx + 1}. ${it.label.split(' - ')[0]}</span>
        <i class="fas fa-times" onclick="removeItem('${id}', event)" title="Quitar"></i>
      </span>
    `;
  }).join('<span style="color: #64748b; font-size: 0.7rem;">&lt;</span>');
}

function selectItem(id) {
  if (selectedIds.includes(id)) return;
  selectedIds.push(id);
  renderPool();
  renderSequence();
  hideFeedback();
}

function removeItem(id, e) {
  e.stopPropagation();
  selectedIds = selectedIds.filter(x => x !== id);
  renderPool();
  renderSequence();
  hideFeedback();
}

function resetGame() {
  selectedIds = [];
  shuffledItems = shuffle(items);
  renderPool();
  renderSequence();
  hideFeedback();
}

function hideFeedback() {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.style.display = 'none';
}

function verify() {
  const fb = document.getElementById('feedback');
  if (selectedIds.length !== items.length) {
    fb.className = 'feedback error';
    fb.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Debes ordenar las 7 complejidades antes de verificar. Llevas ${selectedIds.length} de 7.`;
    fb.style.display = 'block';
    return;
  }

  const correctOrder = items.map(x => x.id);
  const isCorrect = selectedIds.every((id, idx) => id === correctOrder[idx]);

  if (isCorrect) {
    fb.className = 'feedback success';
    fb.innerHTML = `<i class="fas fa-check-circle"></i> <strong>¡Excelente deducción!</strong> Has ordenado la jerarquía correctamente: <code>O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ) &lt; O(n!)</code>.`;
  } else {
    fb.className = 'feedback error';
    fb.innerHTML = `<i class="fas fa-times-circle"></i> <strong>Secuencia incorrecta.</strong> Recuerda que las funciones logarítmicas crecen mucho más lento que las lineales, y las polinomiales (n²) son significativamente más eficientes que las exponenciales (2ⁿ). Revisa el orden e inténtalo nuevamente.`;
  }
  fb.style.display = 'block';
}

renderPool();
renderSequence();
</script>

</body>
</html>
