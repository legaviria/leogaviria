<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constructor y Visualizador de Árboles Binarios</title>
  <style>
    :root {
      --bg: #0e0e11; --card: #141923; --border: #232d42; --text: #fff;
      --muted: #94a3b8; --sky: #38bdf8; --purple: #a855f7; --green: #10b981;
    }
    body.theme-light {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --sky: #0284c7; --purple: #9333ea; --green: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .header { text-align: center; margin-bottom: 12px; }
    .header h3 { font-size: 1.1rem; color: var(--green); margin-bottom: 4px; }
    .canvas-box { width: 100%; height: 180px; background: #080b10; border: 1px solid var(--border); border-radius: 8px; position: relative; margin-bottom: 12px; overflow: hidden; }
    svg { width: 100%; height: 100%; }
    .traversal-buttons { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn { padding: 6px 12px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.active { border-color: var(--green); background: rgba(16, 185, 129, 0.2); color: #86efac; }
    .res-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.85rem; text-align: center; color: #fde047; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>🌳 Visualizador de Árbol Binario de Búsqueda (BST)</h3>
      <p style="font-size:0.75rem; color:var(--muted)">Propiedad BST: Subárbol izquierdo &lt; Raíz &lt; Subárbol derecho.</p>
    </div>

    <div class="canvas-box">
      <svg id="treeSvg">
        <!-- Lines -->
        <line x1="340" y1="35" x2="220" y2="90" stroke="#475569" stroke-width="2"/>
        <line x1="340" y1="35" x2="460" y2="90" stroke="#475569" stroke-width="2"/>
        <line x1="220" y1="90" x2="160" y2="145" stroke="#475569" stroke-width="2"/>
        <line x1="220" y1="90" x2="280" y2="145" stroke="#475569" stroke-width="2"/>
        <line x1="460" y1="90" x2="400" y2="145" stroke="#475569" stroke-width="2"/>
        <line x1="460" y1="90" x2="520" y2="145" stroke="#475569" stroke-width="2"/>
        <!-- Nodes -->
        <circle id="n50" cx="340" cy="35" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="340" y="40" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">50</text>
        <circle id="n30" cx="220" cy="90" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="220" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">30</text>
        <circle id="n70" cx="460" cy="90" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="460" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">70</text>
        <circle id="n20" cx="160" cy="145" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="160" y="149" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">20</text>
        <circle id="n40" cx="280" cy="145" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="280" y="149" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">40</text>
        <circle id="n60" cx="400" cy="145" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="400" y="149" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">60</text>
        <circle id="n80" cx="520" cy="145" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="520" y="149" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">80</text>
      </svg>
    </div>

    <div class="traversal-buttons">
      <button class="btn active" id="btnIn" onclick="runTraversal('in')">Recorrido Inorden (I-R-D)</button>
      <button class="btn" id="btnPre" onclick="runTraversal('pre')">Recorrido Preorden (R-I-D)</button>
      <button class="btn" id="btnPost" onclick="runTraversal('post')">Recorrido Postorden (I-D-R)</button>
    </div>

    <div class="res-box" id="resBox">Inorden: [20, 30, 40, 50, 60, 70, 80] (¡Siempre ordenado ascendente!)</div>
  </div>

  <script>
    const traversals = {
      in: { seq: ["n20", "n30", "n40", "n50", "n60", "n70", "n80"], txt: "Inorden (I-R-D): [20, 30, 40, 50, 60, 70, 80] ➔ ¡Produce los datos ordenados!" },
      pre: { seq: ["n50", "n30", "n20", "n40", "n70", "n60", "n80"], txt: "Preorden (R-I-D): [50, 30, 20, 40, 70, 60, 80] ➔ Útil para clonar/serializar el árbol." },
      post: { seq: ["n20", "n40", "n30", "n60", "n80", "n70", "n50"], txt: "Postorden (I-D-R): [20, 40, 30, 60, 80, 70, 50] ➔ Útil para liberar memoria de hojas a raíz." }
    };

    function runTraversal(type) {
      document.getElementById('btnIn').classList.toggle('active', type === 'in');
      document.getElementById('btnPre').classList.toggle('active', type === 'pre');
      document.getElementById('btnPost').classList.toggle('active', type === 'post');

      const all = ["n50", "n30", "n70", "n20", "n40", "n60", "n80"];
      all.forEach(id => {
        const el = document.getElementById(id);
        el.setAttribute('fill', '#1e293b');
        el.setAttribute('stroke', '#38bdf8');
      });

      const t = traversals[type];
      document.getElementById('resBox').textContent = t.txt;

      t.seq.forEach((id, idx) => {
        setTimeout(() => {
          const el = document.getElementById(id);
          el.setAttribute('fill', '#10b981');
          el.setAttribute('stroke', '#86efac');
        }, (idx + 1) * 350);
      });
    }
  </script>
</body>
</html>
