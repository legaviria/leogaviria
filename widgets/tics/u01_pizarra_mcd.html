<script>
    const leccion = {"titulo": "MCD por Descomposici\u00f3n Prima", "pasos": [{"badge": "Inicio", "explicacion": "\u00a1Hola a todos! Bienvenidos a la clase.", "expresion": "saludo", "acciones": [{"tipo": "cambiar_color", "color": "ink", "duracion": 50}]}, {"badge": "Concepto", "explicacion": "Vamos a aprender sobre el M\u00e1ximo Com\u00fan Divisor.", "expresion": "explicando", "acciones": [{"tipo": "cambiar_color", "color": "ink", "duracion": 100}, {"tipo": "escribir", "id": "t_def", "zona": "def_title", "contenido": "\\text{MCD: M\u00e1ximo Com\u00fan Divisor}", "estilo": "pen-title", "duracion": 600}]}, {"badge": "Regla", "explicacion": "Repasemos la regla principal para calcularlo mediante sus factores primos.", "expresion": "explicando", "acciones": [{"tipo": "cambiar_color", "color": "blue", "duracion": 100}, {"tipo": "escribir", "id": "p_def1", "zona": "def_body1", "contenido": "\\text{Se descomponen los n\u00fameros en factores primos,}", "estilo": "pen-math-large", "duracion": 600}, {"tipo": "escribir", "id": "p_def2", "zona": "def_body2", "contenido": "\\text{y se multiplican SOLO los factores comunes al menor exponente.}", "estilo": "pen-math-large", "duracion": 800}]}, {"badge": "Ejemplo", "explicacion": "Ahora aplicaremos el m\u00e9todo para hallar el MCD de 12 y 18.", "expresion": "explicando", "acciones": [{"tipo": "cambiar_color", "color": "ink", "duracion": 100}, {"tipo": "escribir", "id": "t1", "zona": "title", "contenido": "\\text{Ejemplo: MCD}(12, 18)", "estilo": "pen-title", "duracion": 500}]}, {"badge": "Paso 1", "explicacion": "Descomponemos el n\u00famero 12 dividiendo secuencialmente entre n\u00fameros primos.", "expresion": "explicando", "acciones": [{"tipo": "cambiar_color", "color": "blue", "duracion": 100}, {"tipo": "escribir", "id": "lbl_12", "zona": "col1_top", "contenido": "\\mathbf{12 \\mid 2}", "estilo": "pen-math-large", "duracion": 500}, {"tipo": "escribir", "id": "step_12_1", "zona": "col1_mid1", "contenido": "\\mathbf{\\phantom{0}6 \\mid 2}", "estilo": "pen-math-large", "duracion": 500}, {"tipo": "escribir", "id": "step_12_2", "zona": "col1_mid2", "contenido": "\\mathbf{\\phantom{0}3 \\mid 3}", "estilo": "pen-math-large", "duracion": 500}, {"tipo": "escribir", "id": "step_12_3", "zona": "col1_bot", "contenido": "\\mathbf{\\phantom{0}1 \\mid}", "estilo": "pen-math-large", "duracion": 300}, {"tipo": "cambiar_color", "color": "orange", "duracion": 100}, {"tipo": "escribir", "id": "res_12", "zona": "col1_res", "contenido": "12 = 2^2 \\times 3", "estilo": "pen-math-large", "duracion": 500}]}, {"badge": "Paso 2", "explicacion": "Realizamos la descomposici\u00f3n prima del n\u00famero 18.", "expresion": "explicando", "acciones": [{"tipo": "cambiar_color", "color": "blue", "duracion": 100}, {"tipo": "escribir", "id": "lbl_18", "zona": "col2_top", "contenido": "\\mathbf{18 \\mid 2}", "estilo": "pen-math-large", "duracion": 500}, {"tipo": "escribir", "id": "step_18_1", "zona": "col2_mid1", "contenido": "\\mathbf{\\phantom{0}9 \\mid 3}", "estilo": "pen-math-large", "duracion": 500}, {"tipo": "escribir", "id": "step_18_2", "zona": "col2_mid2", "contenido": "\\mathbf{\\phantom{0}3 \\mid 3}", "estilo": "pen-math-large", "duracion": 500}, {"tipo": "escribir", "id": "step_18_3", "zona": "col2_bot", "contenido": "\\mathbf{\\phantom{0}1 \\mid}", "estilo": "pen-math-large", "duracion": 300}, {"tipo": "cambiar_color", "color": "orange", "duracion": 100}, {"tipo": "escribir", "id": "res_18", "zona": "col2_res", "contenido": "18 = 2 \\times 3^2", "estilo": "pen-math-large", "duracion": 500}]}, {"badge": "Paso 3", "explicacion": "Elegimos \u00fanicamente los factores primos comunes con su menor exponente.", "expresion": "atenta", "acciones": [{"tipo": "cambiar_color", "color": "ink", "duracion": 100}, {"tipo": "escribir", "id": "rule_text", "zona": "summary_rule", "contenido": "\\text{Factores comunes al menor exponente: } 2 \\text{ y } 3", "estilo": "pen-math-large", "duracion": 700}]}, {"badge": "Paso 4", "explicacion": "Multiplicamos los factores seleccionados para obtener el resultado final.", "expresion": "genial", "acciones": [{"tipo": "cambiar_color", "color": "blue", "duracion": 100}, {"tipo": "escribir", "id": "final_calc", "zona": "summary_calc", "contenido": "\\text{MCD}(12, 18) = 2 \\times 3 =", "estilo": "pen-math-huge", "duracion": 800}, {"tipo": "cambiar_color", "color": "green", "duracion": 100}, {"tipo": "escribir", "id": "final_res", "zona": "summary_res", "contenido": "6", "estilo": "pen-math-huge", "duracion": 400}, {"tipo": "subrayado_target", "target_id": "final_res", "duracion": 300}]}]};

    const LAYOUT = {
        zones: {
            def_title:    { x: 220, y: 12 },
            def_body1:    { x: 140, y: 40 },
            def_body2:    { x: 20,  y: 65 },

            title:        { x: 270, y: 98 },

            col1_top:     { x: 140, y: 135 },
            col1_mid1:    { x: 140, y: 162 },
            col1_mid2:    { x: 140, y: 189 },
            col1_bot:     { x: 140, y: 216 },
            col1_res:     { x: 120, y: 248 },

            col2_top:     { x: 480, y: 135 },
            col2_mid1:    { x: 480, y: 162 },
            col2_mid2:    { x: 480, y: 189 },
            col2_bot:     { x: 480, y: 216 },
            col2_res:     { x: 460, y: 248 },

            summary_rule: { x: 180, y: 288 },
            summary_calc: { x: 210, y: 324 },
            summary_res:  { x: 465, y: 324 }
        }
    };

    const COLOR_MAP = { "ink": "#1e293b", "blue": "#0284c7", "orange": "#ea580c", "green": "#16a34a" };
    const SPEEDS = [0.5, 1.0, 1.5, 2.0];

    let currentStepIndex = 0;
    let speedIndex = 1;
    let playbackSpeed = 1.0;
    let activeColor = "ink";
    let isAnimating = false;

    function initEngine() {
        document.getElementById('lesson-title').innerText = '¡Vamos a la Pizarra! - MCD por Descomposición Prima';
        goToStep(0, false);
    }

    function setToolColor(colorKey) {
        activeColor = colorKey;
        const dot = document.getElementById('nib-dot');
        if (dot) dot.setAttribute('fill', COLOR_MAP[colorKey] || COLOR_MAP.ink);
    }

    function toggleSpeed() {
        speedIndex = (speedIndex + 1) % SPEEDS.length;
        playbackSpeed = SPEEDS[speedIndex];
        document.getElementById('speed-btn').innerText = playbackSpeed.toFixed(1) + 'x';
    }

    function restartLesson() { goToStep(0, false); }

    function nextStep() {
        if (currentStepIndex < leccion.pasos.length - 1 && !isAnimating) {
            goToStep(currentStepIndex + 1, true);
        }
    }

    function previousStep() {
        if (currentStepIndex > 0 && !isAnimating) {
            goToStep(currentStepIndex - 1, false);
        }
    }

    function updateUI() {
        const step = leccion.pasos[currentStepIndex];
        const badgeEl = document.getElementById('step-badge');

        if (step.badge) {
            badgeEl.innerText = step.badge;
            badgeEl.style.display = 'inline-block';
        } else {
            badgeEl.innerText = '';
            badgeEl.style.display = 'none';
        }

        document.getElementById('step-description').innerText = step.explicacion;
        document.getElementById('step-counter').innerText = `${currentStepIndex + 1}/${leccion.pasos.length}`;

        const pct = ((currentStepIndex + 1) / leccion.pasos.length) * 100;
        document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function ensureVisible(yPos) {
        // Todo el contenido está ajustado exactamente a la pizarra
    }

    function goToStep(stepIndex, animated = true) {
        if (stepIndex < 0 || stepIndex >= leccion.pasos.length) return;
        currentStepIndex = stepIndex;
        updateUI();

        if (!animated) {
            rebuildBoardStateUpTo(stepIndex);
            hidePencil();
        } else {
            rebuildBoardStateUpTo(stepIndex - 1);
            executeStepSequence(stepIndex);
        }
    }

    function rebuildBoardStateUpTo(targetStepIndex) {
        const container = document.getElementById('canvas-container');
        const svg = document.getElementById('svg-canvas');

        container.querySelectorAll('.pen-element').forEach(e => e.remove());
        svg.innerHTML = '';

        for (let i = 0; i <= targetStepIndex; i++) {
            const paso = leccion.pasos[i];
            if (paso && paso.acciones) {
                paso.acciones.forEach(acc => applyActionInstant(acc));
            }
        }

        if (targetStepIndex >= 0 && leccion.pasos[targetStepIndex].acciones.length > 0) {
            const lastAction = leccion.pasos[targetStepIndex].acciones.slice(-1)[0];
            if (lastAction) {
                const pos = getZonePos(lastAction);
                ensureVisible(pos.y);
            }
        }
    }

    function getZonePos(acc) {
        if (acc.zona && LAYOUT.zones[acc.zona]) return LAYOUT.zones[acc.zona];
        return acc.pos || { x: 200, y: 100 };
    }

    function renderMathOrText(el, text) {
        if (text.includes('\\') || text.includes('_') || text.includes('^') || text.includes('=')) {
            katex.render(text, el, { throwOnError: false });
        } else {
            el.innerText = text;
        }
    }

    function applyActionInstant(acc) {
        const container = document.getElementById('canvas-container');
        const svg = document.getElementById('svg-canvas');
        const pos = getZonePos(acc);

        if (acc.tipo === 'cambiar_color') {
            setToolColor(acc.color);
        }
        else if (acc.tipo === 'escribir') {
            let el = document.getElementById(acc.id);
            if (!el) {
                el = document.createElement('div');
                el.id = acc.id;
                el.className = `pen-element color-${activeColor} ${acc.estilo || ''}`;
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                container.appendChild(el);
            }
            renderMathOrText(el, acc.contenido);
        }
        else if (acc.tipo === 'subrayado_target') {
            const targetEl = document.getElementById(acc.target_id);
            if (targetEl) {
                const containerRect = container.getBoundingClientRect();
                const rect = targetEl.getBoundingClientRect();
                const startX = rect.left - containerRect.left;
                const endX = rect.right - containerRect.left;
                const y = rect.bottom - containerRect.top + 2;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', startX);
                line.setAttribute('y1', y);
                line.setAttribute('x2', endX);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', COLOR_MAP[activeColor]);
                line.setAttribute('stroke-width', '2.5');
                svg.appendChild(line);
            }
        }
    }

    async function executeStepSequence(stepIndex) {
        isAnimating = true;
        const paso = leccion.pasos[stepIndex];
        for (let acc of paso.acciones) {
            await runSingleActionAnimated(acc);
        }
        hidePencil();
        isAnimating = false;
    }

    function moveWritingTip(x, y) {
        const nib = document.getElementById('pencil-nib');
        nib.style.display = 'block';
        nib.style.opacity = '1';
        nib.style.left = x + 'px';
        nib.style.top = y + 'px';
    }

    function hidePencil() {
        const nib = document.getElementById('pencil-nib');
        if (nib) nib.style.display = 'none';
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms / playbackSpeed));
    }

    async function runSingleActionAnimated(acc) {
        const container = document.getElementById('canvas-container');
        const svg = document.getElementById('svg-canvas');
        const pos = getZonePos(acc);

        ensureVisible(pos.y);

        if (acc.tipo === 'cambiar_color') {
            setToolColor(acc.color);
            await delay(acc.duracion || 100);
        }
        else if (acc.tipo === 'escribir') {
            let el = document.getElementById(acc.id);
            let clipWrapper;

            if (!el) {
                el = document.createElement('div');
                el.id = acc.id;
                el.className = `pen-element color-${activeColor} ${acc.estilo || ''}`;
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';

                clipWrapper = document.createElement('span');
                clipWrapper.className = 'pencil-clip';
                el.appendChild(clipWrapper);
                container.appendChild(el);
            } else {
                clipWrapper = el.querySelector('.pencil-clip') || el;
            }

            renderMathOrText(clipWrapper, acc.contenido);

            const totalWidth = el.offsetWidth || 150;
            const startX = pos.x;
            const endX = pos.x + totalWidth;
            const startY = pos.y + 15;

            const duration = acc.duracion || 500;
            const steps = 12;
            const stepDuration = duration / steps;

            for (let i = 1; i <= steps; i++) {
                const progress = i / steps;
                clipWrapper.style.clipPath = `polygon(0 0, ${progress * 100}% 0, ${progress * 100}% 100%, 0 100%)`;
                moveWritingTip(startX + (endX - startX) * progress, startY);
                await delay(stepDuration);
            }
            clipWrapper.style.clipPath = 'none';
        }
        else if (acc.tipo === 'subrayado_target') {
            const targetEl = document.getElementById(acc.target_id);
            if (targetEl) {
                const containerRect = container.getBoundingClientRect();
                const rect = targetEl.getBoundingClientRect();
                const startX = rect.left - containerRect.left;
                const endX = rect.right - containerRect.left;
                const y = rect.bottom - containerRect.top + 2;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', startX);
                line.setAttribute('y1', y);
                line.setAttribute('x2', startX);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', COLOR_MAP[activeColor]);
                line.setAttribute('stroke-width', '2.5');
                svg.appendChild(line);

                const steps = 10;
                for (let i = 1; i <= steps; i++) {
                    const progress = i / steps;
                    const curX = startX + (endX - startX) * progress;
                    line.setAttribute('x2', curX);
                    moveWritingTip(curX, y);
                    await delay((acc.duracion || 300) / steps);
                }
            }
        }
    }

    window.onload = () => { initEngine(); };
</script>

</html>
